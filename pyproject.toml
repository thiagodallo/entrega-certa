[project]
name = "entrega-certa"
version = "0.1.0"
description = "API para controlar entregas de atividades com prazo. Projeto Final de Backend (SATC), Etapa 1."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "pg8000>=1.31.5",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.54.0",
]

[tool.alembic]
script_location = "%(here)s/db"
version_locations = ["%(here)s/db/migration"]
prepend_sys_path = ["."]
file_template = "%%(rev)s__%%(slug)s"
